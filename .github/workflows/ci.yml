name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # Inlined at build time by Vite; the build guard refuses to run without
      # them (a missing cloud compiles every image URL to res.cloudinary.com/
      # undefined/... and ships a blank page; a missing API base points the
      # app at the wrong backend; a missing VITE_TEST_MODE used to ship a
      # live-money default). Public values, not secrets.
      VITE_CLOUDINARY_CLOUD_NAME: ece5jmhy
      VITE_API_BASE_URL: https://api.glasspay.app
      VITE_TEST_MODE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs WITH coverage on purpose: vite.config.js already carries global
      # and per-glob floors, but `npm run test` alone never evaluated them, so
      # they gated nothing. Same single run, now enforced. The floors are
      # regression gates, not targets — raise them with new tests, never lower
      # them to go green.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage summary (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 7

      # Blocking on drift: this is the only step that catches a frontend call to
      # a route the backend doesn't have — it type-checks, lints, builds and
      # passes unit tests exactly like a real call, so nothing else complains.
      #
      # f6d7bb1 made this advisory so "a backend deploy that hasn't landed yet
      # must not fail a frontend PR". That case still doesn't block: add the
      # route to PENDING_BACKEND_LIST in scripts/endpoint-audit.mjs (each entry
      # owes a reason) and it reports as PENDING, never as UNMATCHED.
      # UNCONNECTED never fails the build either — only UNMATCHED does.
      #
      # An unreachable spec still exits 0 (a backend outage must not block a
      # frontend PR), but now raises a warning annotation instead of a bare
      # SKIP line in the log, so a skipped audit is visible rather than silent.
      - name: Endpoint audit
        run: npm run audit:endpoints -- --strict

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
