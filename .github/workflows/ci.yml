name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for every job in this workflow. Each job that needs more
# (CodeQL needs security-events: write) declares it at the job level, which
# overrides this. Without it, GITHUB_TOKEN inherits the repository/org default
# — commonly read-write — into jobs that only ever need to read the tree.
permissions:
  contents: read

# One run per ref. A superseded pull request keeps burning minutes for
# nothing otherwise, and two runs racing to write the same ref is a source
# of confusing failures.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # Inlined at build time by Vite; the build guard refuses to run without
      # them (a missing cloud compiles every image URL to res.cloudinary.com/
      # undefined/... and ships a blank page; a missing API base points the
      # app at the wrong backend; a missing VITE_TEST_MODE used to ship a
      # live-money default). Public values, not secrets.
      VITE_CLOUDINARY_CLOUD_NAME: ece5jmhy
      VITE_API_BASE_URL: https://api.glasspay.app
      VITE_TEST_MODE: "false"

    steps:
      # Actions are pinned to a commit SHA, not a floating tag. A tag can be
      # moved to point at new code by whoever controls the tag; a SHA cannot.
      # Dependabot's github-actions ecosystem keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      # Every form control must have an accessible name. jsx-a11y cannot catch
      # this -- its label rule checks that a <label> HAS a control, not that
      # every control HAS a label, and native <input> elements sit outside
      # its control-has-associated-label rule entirely. The repo shipped with
      # 80 unnamed controls across 33 files for exactly that reason.
      - name: Input accessible-name check
        run: npm run check:input-labels

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs WITH coverage on purpose: vite.config.js already carries global
      # and per-glob floors, but `npm run test` alone never evaluated them, so
      # they gated nothing. Same single run, now enforced. The floors are
      # regression gates, not targets — raise them with new tests, never lower
      # them to go green.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage summary (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 7

      # Blocking on drift: this is the only step that catches a frontend call to
      # a route the backend doesn't have — it type-checks, lints, builds and
      # passes unit tests exactly like a real call, so nothing else complains.
      #
      # f6d7bb1 made this advisory so "a backend deploy that hasn't landed yet
      # must not fail a frontend PR". That case still doesn't block: add the
      # route to PENDING_BACKEND_LIST in scripts/endpoint-audit.mjs (each entry
      # owes a reason) and it reports as PENDING, never as UNMATCHED.
      # UNCONNECTED never fails the build either — only UNMATCHED does.
      #
      # An unreachable spec still exits 0 (a backend outage must not block a
      # frontend PR), but now raises a warning annotation instead of a bare
      # SKIP line in the log, so a skipped audit is visible rather than silent.
      - name: Endpoint audit
        run: npm run audit:endpoints -- --strict

      - name: Build
        run: npm run build

      # The service worker is the one shipped artifact whose BEHAVIOUR nothing
      # else verifies: it controls offline navigation and API caching, and it
      # is only visible once it is deployed. verify:pwa executes the built
      # dist/sw.js in a mocked ServiceWorkerGlobalScope and drives real fetch
      # events through it, so a broken worker fails the PR instead of
      # production. It has to run after the build — it inspects dist/sw.js.
      - name: Verify the built service worker
        run: npm run verify:pwa

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the scan sees commits a shallow clone would hide.
          fetch-depth: 0

      # Scans the commits in the push / pull request for credentials, and
      # exits non-zero (183) when it finds one. `--results=verified,unknown`
      # is TruffleHog's documented CI setting: it reports a credential that
      # was confirmed live, or one whose verification could not complete, and
      # ignores the unverified noise a generic pattern match produces.
      #
      # The action passes --fail itself, so only the result filter is here.
      # The CLI version is pinned alongside the action SHA: the action runs
      # the scanner with --no-update, so a floating image would silently keep
      # using an old detector set. The image tag carries NO `v` prefix --
      # ghcr.io publishes `3.99.3`, not `v3.99.3`, and a wrong tag fails the
      # job with "manifest unknown" rather than scanning anything.
      - name: Scan for leaked credentials
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          version: "3.99.3"
          extra_args: --results=verified,unknown

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
