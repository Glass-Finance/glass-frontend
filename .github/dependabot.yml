# Dependabot — tuned so opened PRs are small and mergeable against main.
#
# Goals:
# - Weekly, few PRs at a time (not a wall of stale majors)
# - Group routine patch/minor updates into one prod PR + one dev PR
# - Block high-churn majors (eslint/vitest/vite toolchain, motion, lucide…)
#   until we take them on deliberately — those previously arrived as a
#   13-package blast (#42) that could not be trusted blindly.
# - Security updates still work (Dependabot security alerts are separate).
#
# Config is read from the default branch (main) — merge this file there.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    # Prefer lockfile bumps when the range already allows them; only
    # rewrite package.json when a new range is required.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime libs: only patch + minor (safe-ish app deps)
      production-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
      # Tooling: only patch + minor (keeps vite/eslint/vitest majors out)
      development-patch-minor:
        dependency-type: development
        update-types:
          - patch
          - minor
    ignore:
      # Majors need their own PR + full CI / manual smoke — not a group bump
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: motion
        update-types: [version-update:semver-major]
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@tanstack/react-query"
        update-types: [version-update:semver-major]
      # 0.x: the MINOR is this package's breaking axis, not the major. 0.5.0
      # shipped breaking changes to react-refresh/only-export-components and
      # renamed customHOCs -> extraHOCs, which broke lint on main (#58). Block
      # minor + major; safe patches still ride the dev group and land as
      # lockfile-only bumps because versioning-strategy is increase-if-necessary.
      - dependency-name: eslint-plugin-react-refresh
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # The workflow files pin every action to a commit SHA rather than a tag,
  # so this ecosystem is what keeps those pins current. Without it, a pinned
  # action never moves again — which is the point of pinning, but it also
  # means security fixes to the actions themselves have to be applied by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Actions move together; one PR for all of them is easier to review
      # than one per action.
      github-actions:
        patterns:
          - "*"
