<!doctype html>
<html lang="en-NG">
  <head>
    <!-- CSP script-src hardening (vercel.json's Content-Security-Policy
         header): every inline script tag below with no src attribute
         (structured data, Pendo bootstrap) is allowlisted by a
         'sha256-<hash>' entry instead of 'unsafe-inline'.

         If you edit any of those scripts' content: `npm run build` then
         `node scripts/compute-csp-hashes.mjs`, and swap the matching hash
         into vercel.json's Content-Security-Policy value.

         Google Identity Services (loaded for the "Continue with Google"
         button) also injects its own inline scripts at runtime with no
         counterpart in this repo — those hashes are NOT pre-listed. Under
         enforcement, the browser will block them and log a violation.
         To fix: load the page, sign in, copy the new hash(es) off the
         console violation, and add them to script-src.

         CSP is now in ENFORCEMENT mode. Violations are reported to the
         Report-To endpoint (see vercel.json). Monitor for violations after
         each deploy and add any missing hashes. -->
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Warm the Cloudinary connection before the first image URL is
         parsed — every landing image resolves here, so skipping DNS +
         TLS setup shaves ~100-300ms off first paint on cold caches.
         No crossorigin: images are fetched no-cors, a CORS-mode socket
         would be a different (wasted) connection. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Structured data -->
    <!-- CSP: this exact content is allowlisted by a sha256 hash in
         vercel.json's Content-Security-Policy-Report-Only script-src.
         Any edit to the text below invalidates that hash and must be
         paired with recomputing it (see the CSP note at the top of
         <head> for how). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Glasspay",
            "url": "https://glasspay.app"
          },
          {
            "@type": "Organization",
            "name": "Glasspay",
            "url": "https://glasspay.app",
            "logo": "https://glasspay.app/Glass.png",
            "email": "glasspayhq@gmail.com",
            "sameAs": ["https://x.com/glasspayhq", "https://www.instagram.com/glasspayhq"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Glasspay",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web",
            "url": "https://glasspay.app",
            "description": "Community finance platform for Nigerian associations, clubs, and schools.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "NGN"
            }
          }
        ]
      }
    </script>

    <!-- SEO -->
    <title>Glasspay: Community Finance, Crystal Clear</title>
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Stop chasing dues in group chats. Glasspay lets Nigerian associations, clubs, and schools collect, track, and manage community funds in one place."
    />
    <meta
      name="keywords"
      content="community finance Nigeria, dues collection app, payment management Nigeria, associations fintech, clubs payment Nigeria"
    />
    <link rel="canonical" href="https://glasspay.app/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#002FA7" />

    <!-- Open Graph -->
    <meta property="og:title" content="Glasspay: Community Finance, Crystal Clear" />
    <meta
      property="og:description"
      content="Stop chasing dues in group chats. Glasspay lets Nigerian associations, clubs, and schools collect, track, and manage community funds in one place."
    />
    <meta property="og:url" content="https://glasspay.app/" />
    <meta property="og:type" content="website" />
    <!-- Hosted on app.glasspay.app (not the glasspay.app apex) -- this asset
         is identical on both domains, but the apex has a history of Vercel
         deployment/domain-pinning lag, while the app subdomain reliably
         tracks the latest deploy. Pointing here removes that dependency. -->
    <meta property="og:image" content="https://app.glasspay.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Glasspay: community finance, crystal clear" />
    <meta property="og:site_name" content="Glasspay" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@glasspayhq" />
    <meta name="twitter:title" content="Glasspay: Community Finance, Crystal Clear" />
    <meta
      name="twitter:description"
      content="Stop chasing dues in group chats. Glasspay helps your community collect and track funds in one place."
    />
    <meta name="twitter:image" content="https://app.glasspay.app/og-image.png" />

    <!-- Fonts are self-hosted via @fontsource (imported in main.jsx) --
         no external Google Fonts request, no preconnect/preload/swap dance
         needed. -->

    <!-- Pendo -->
    <!-- CSP: hash-allowlisted (see the CSP note at the top of <head>). The
         API key below is part of the hashed content -- rotating it (or
         Pendo changing this bootstrap snippet) invalidates the hash and
         needs it recomputed, same as the structured-data block above. -->
    <script>
      (function (apiKey) {
        (function (p, e, n, d, o) {
          var v, w, x, y, z;
          o = p[d] = p[d] || {};
          o._q = o._q || [];
          v = ["initialize", "identify", "updateOptions", "pageLoad", "track", "trackAgent"];
          for (w = 0, x = v.length; w < x; ++w)
            (function (m) {
              o[m] =
                o[m] ||
                function () {
                  o._q[m === v[0] ? "unshift" : "push"]([m].concat([].slice.call(arguments, 0)));
                };
            })(v[w]);
          y = e.createElement(n);
          y.async = !0;
          y.src = "https://cdn.pendo.io/agent/static/" + apiKey + "/pendo.js";
          z = e.getElementsByTagName(n)[0];
          z.parentNode.insertBefore(y, z);
        })(window, document, "script", "pendo");
      })("35c6c2bb-9b67-4827-a2ca-c46d501329c2");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
